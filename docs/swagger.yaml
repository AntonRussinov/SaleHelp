  /v1/shops/{shopId}/products:
    get:
      description: 'Список товаров по shopId. Проверка доступа по JWT. Query: limit,
        offset'
      parameters:
      - description: ID магазина
        in: path
        name: shopId
        required: true
        type: integer
      - default: 20
        description: Лимит
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: items, total, limit, offset
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Товары магазина
      tags:
      - shops
  /v1/telegram/webhook:
    post:
      consumes:
      - application/json
      description: Принимает Update от Telegram Bot API. Опционально проверяет заголовок
        X-Telegram-Bot-Api-Secret-Token.
      parameters:
      - description: Telegram Update (JSON)
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "403":
          description: Forbidden
      summary: Telegram webhook
      tags:
      - telegram
  /version:
    get:
      description: |-
        Версия приложения, Go, коммит, время сборки
        Возвращает 200 OK если сервис жив
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - system
      - system
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
