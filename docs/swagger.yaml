  /v1/shops/{shopId}/alerts:
    get:
      description: Получает список алертов с фильтрацией и пагинацией. Доступ только
        у владельца магазина (JWT).
      parameters:
      - description: ID магазина
        in: path
        name: shopId
        required: true
        type: integer
      - description: ID товара для фильтрации
        in: query
        name: productId
        type: integer
      - description: Тип алерта
        enum:
        - price_drop
        - stock_low
        - stock_zero
        in: query
        name: type
        type: string
      - description: Статус алерта
        enum:
        - active
        - inactive
        in: query
        name: status
        type: string
      - description: Лимит записей (по умолчанию 20, максимум 100)
        in: query
        name: limit
        type: integer
      - description: Смещение (по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListAlertsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Получить список алертов
      tags:
      - alerts
    post:
      consumes:
      - application/json
      description: |-
        Создает новый алерт для магазина. Доступ только у владельца магазина (JWT).
        severity, scope и message вычисляются автоматически.
        Если productId не передан — алерт работает по всем товарам магазина.

        **Типы алертов и структура payload:**

        `stock_zero` — товар закончился. payload не нужен:
        `{"type":"stock_zero","productId":42}`

        `stock_low` — мало остатков. threshold — минимум в штуках:
        `{"type":"stock_low","productId":42,"payload":{"threshold":10}}`

        `price_drop` — снижение цены. percent и/или amount — пороги срабатывания. mode: any|all:
        `{"type":"price_drop","productId":42,"payload":{"percent":10,"mode":"any"}}`
        `{"type":"price_drop","payload":{"amount":500,"mode":"any"}}`
        `{"type":"price_drop","payload":{"percent":10,"amount":500,"mode":"all"}}`
      parameters:
      - description: ID магазина
        in: path
        name: shopId
        required: true
        type: integer
      - description: Данные алерта
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAlertRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AlertResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Создать алерт
      tags:
      - alerts
