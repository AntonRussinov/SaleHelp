  /v1/shops/{shopId}/ai-settings/templates/{category}:
    put:
      consumes:
      - application/json
      description: |-
        Создаёт или обновляет шаблон для категории отзыва: дополнительные инструкции для AI и переопределение тональности.

        **Категории (`category` в пути):**
        - `positive` — положительные отзывы (4–5 звёзд)
        - `neutral` — нейтральные отзывы (3 звезды)
        - `negative` — негативные отзывы (1–2 звезды)

        **Поля запроса:**
        - `customPrompt` — дополнительные инструкции для AI (макс. 500 символов). Например: "Упомяни программу лояльности"
        - `toneVoiceOverride` — переопределить тональность для этой категории: `standard` | `friendly` | `official` | `empathic` | `minimalist`. Пустая строка = использовать глобальную настройку
        - `enabled` — включить/выключить шаблон для этой категории (по умолчанию `true`)
      parameters:
      - description: ID магазина
        in: path
        name: shopId
        required: true
        type: integer
      - description: Категория отзыва
        enum:
        - positive
        - neutral
        - negative
        in: path
        name: category
        required: true
        type: string
      - description: Данные шаблона
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpsertAITemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AITemplateResponse'
        "400":
          description: Невалидная категория или тело запроса
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Сохранить шаблон AI по категории отзыва
      tags:
      - ai-settings
  /v1/shops/{shopId}/alerts:
    get:
      description: Получает список алертов с фильтрацией и пагинацией. Доступ только
        у владельца магазина (JWT).
      parameters:
