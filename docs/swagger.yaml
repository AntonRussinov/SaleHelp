  /v1/shops/{shopId}/ai-settings:
    get:
      description: |-
        Возвращает полные настройки AI автоответов на отзывы: основные параметры, правила бренда и шаблоны по категориям.
        Если настройки ещё не созданы — возвращает дефолтные значения (не 404), чтобы фронт мог сразу показать форму.

        **Поля ответа:**
        - `isActive` — включён ли AI автоответ для этого магазина
        - `toneOfVoice` — тональность: `standard` | `friendly` | `official` | `empathic` | `minimalist`
        - `responseLength` — длина ответа: `short` | `medium` | `long`
        - `addressing` — обращение: `vy` (вы) | `ty` (ты)
        - `emojiMode` — эмодзи: `none` | `minimal` | `expressive`
        - `rules` — список правил бренда и запрещённых слов (см. `/ai-settings/rules`)
        - `templates` — шаблоны по категориям отзывов: `positive` | `neutral` | `negative`
      parameters:
      - description: ID магазина
        in: path
        name: shopId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AISettingsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Получить AI-настройки магазина
      tags:
      - ai-settings
    put:
      consumes:
      - application/json
      description: |-
        Создаёт или обновляет основные параметры AI автоответов для магазина.
        Возвращает полный объект настроек включая существующие правила и шаблоны.

        **Допустимые значения полей:**
        - `toneOfVoice`: `standard` | `friendly` | `official` | `empathic` | `minimalist`
        - `responseLength`: `short` | `medium` | `long`
        - `addressing`: `vy` (Вы) | `ty` (ты)
        - `emojiMode`: `none` | `minimal` | `expressive`
        - `brandName` — макс. 100 символов
        - `brandDescription` — макс. 500 символов
        - `representativeName` — имя представителя в ответах, макс. 50 символов
        - `signature` — подпись в конце ответа, макс. 200 символов
      parameters:
      - description: ID магазина
        in: path
        name: shopId
        required: true
        type: integer
      - description: Настройки AI
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpsertAISettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AISettingsResponse'
        "400":
          description: Невалидное тело запроса или недопустимое значение поля
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Сохранить AI-настройки магазина
      tags:
      - ai-settings
  /v1/shops/{shopId}/ai-settings/rules:
    post:
      consumes:
      - application/json
      description: |-
        Добавляет правило бренда или запрещённое слово для AI автоответов.
        Лимит правил зависит от тарифа пользователя.

        **Типы правил (`ruleType`):**
        - `rule` — инструкция для AI (например: "Всегда упоминай гарантию 1 год")
        - `forbidden_word` — слово/фраза, которую AI не должен использовать

        `orderIndex` — порядок применения правил (0 = первое).
      parameters:
      - description: ID магазина
        in: path
        name: shopId
        required: true
        type: integer
      - description: Данные правила
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateAIRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AIRuleResponse'
        "400":
          description: Невалидное тело или недопустимый тип правила
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Нет доступа к магазину или достигнут лимит правил тарифа
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Добавить правило AI
      tags:
      - ai-settings
