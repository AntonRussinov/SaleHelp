      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AlertResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
