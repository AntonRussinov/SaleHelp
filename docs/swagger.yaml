basePath: /api
consumes:
- application/json
definitions:
  api.AISettingsResponse:
    properties:
      brandName:
        example: МойБренд
        type: string
      createdAt:
        example: "2024-01-15T10:00:00Z"
        type: string
      customRules:
        example: Всегда упоминай гарантию.
        type: string
      isActive:
        example: true
        type: boolean
      shopId:
        example: 1
        type: integer
      toneOfVoice:
        example: friendly
        type: string
      updatedAt:
        example: "2024-01-15T10:00:00Z"
        type: string
    type: object
  api.AlertResponse:
    properties:
      aiRecommendationId:
        example: 3
        type: integer
      id:
        example: 10
        type: integer
      message:
        example: Снижение цены > 10%
        type: string
      payload:
        type: object
      productId:
        example: 42
        type: integer
      productSizeId:
        example: 7
        type: integer
      resolvedAt:
        example: "2024-01-16T08:00:00Z"
        type: string
      scope:
        example: product
        type: string
      severity:
        example: 4
        type: integer
      shopId:
        example: 1
        type: integer
      status:
        example: active
        type: string
      triggeredAt:
        example: "2024-01-15T10:00:00Z"
        type: string
      type:
        example: price_drop
        type: string
    type: object
  api.CreateAlertRequest:
    properties:
      payload:
        type: object
      productId:
        example: 42
        minimum: 1
        type: integer
      productSizeId:
        example: 7
        minimum: 1
        type: integer
      type:
        example: price_drop
        type: string
    required:
    - type
    type: object
  api.CreateShopRequest:
    properties:
      apiToken:
        example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJleGFtcGxlIn0.ZXhhbXBsZQ
        type: string
      marketplace:
        enum:
        - wildberries
        example: wildberries
        type: string
      name:
        example: Мой магазин WB
        maxLength: 255
        type: string
      wbReportTimezone:
        example: Europe/Moscow
        type: string
    required:
    - apiToken
    - marketplace
    - name
    type: object
  api.GetHealthCheckResponse:
    properties:
      built:
        example: "2024-01-15T10:00:00Z"
        type: string
      gitCommit:
        example: 84b789e
        type: string
      goVersion:
        example: go1.22.0
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  api.HTTPError:
    properties:
      code:
        example: 400
        type: integer
      details:
        example: ""
        type: string
      message:
        example: invalid body
        type: string
      timestamp:
        example: "2024-01-15T10:00:00Z"
        type: string
      validationErrors:
        items:
          $ref: '#/definitions/api.ValidationError'
        type: array
    type: object
  api.ListAlertsResponse:
    properties:
      alerts:
        items:
          $ref: '#/definitions/api.AlertResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 42
        type: integer
    type: object
  api.ListNotificationSettingsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.NotificationSetting'
        type: array
    type: object
  api.NotificationSetting:
    properties:
      category:
        example: orders
        type: string
      defaultEnabled:
        example: true
        type: boolean
      description:
        example: Уведомление о новом сборочном задании FBS
        type: string
      enabled:
        example: true
        type: boolean
      key:
        example: fbs_new_order
        type: string
      title:
        example: Новый заказ FBS
        type: string
    required:
    - key
    type: object
  api.ShopResponse:
    properties:
      createdAt:
        example: "2024-01-15T10:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      isActive:
        example: true
        type: boolean
      lastSyncAt:
        type: string
      lastSyncStatusCode:
        example: 200
        type: integer
      marketplace:
        example: wildberries
        type: string
      name:
        example: Мой магазин WB
        type: string
      subscription:
        $ref: '#/definitions/api.SubscriptionSummary'
      tokenType:
        example: basic
        type: string
      userId:
        example: 5
        type: integer
      wbReportTimezone:
        example: Europe/Moscow
        type: string
    type: object
  api.SubscriptionSummary:
    properties:
      expiresAt:
        example: "2025-01-15T00:00:00Z"
        type: string
      hasActive:
        example: true
        type: boolean
      tier:
        example: business
        type: string
    type: object
  api.UpdateAlertRequest:
    properties:
      payload:
        type: object
      productId:
        example: 42
        minimum: 1
        type: integer
      productSizeId:
        example: 7
        minimum: 1
        type: integer
      status:
        example: inactive
        type: string
    type: object
  api.UpdateNotificationSettingsItem:
    properties:
      enabled:
        example: false
        type: boolean
      key:
        example: fbs_new_order
        type: string
    required:
    - key
    type: object
  api.UpdateNotificationSettingsRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/api.UpdateNotificationSettingsItem'
        type: array
    required:
    - items
    type: object
  api.UpdateShopRequest:
    properties:
      wbReportTimezone:
        example: Asia/Almaty
        type: string
    type: object
  api.UpsertAISettingsRequest:
    properties:
      brandName:
        description: BrandName — название бренда для промпта (опционально)
        example: МойБренд
        maxLength: 500
        type: string
      customRules:
        description: CustomRules — доп. правила для промпта (опционально)
        example: Всегда упоминай гарантию. Не обещай скидки.
        maxLength: 2000
        type: string
      isActive:
        description: IsActive — включена ли генерация AI-ответов для магазина
        example: true
        type: boolean
      toneOfVoice:
        description: 'ToneOfVoice — тон ответов AI. Допустимые значения: standard,
          friendly, official, empathic, minimalist'
        enum:
        - standard
        - friendly
        - official
        - empathic
        - minimalist
        example: friendly
        type: string
    required:
    - toneOfVoice
    type: object
  api.ValidationError:
    properties:
      details:
        example: ""
        type: string
      field:
        example: email
        type: string
      message:
        example: required
        type: string
    type: object
  auth_google.ConfirmTelegramLinkRequest:
    properties:
      code:
        example: A3F7XQ
        type: string
    type: object
  auth_google.LinkTelegramResponse:
    properties:
      expiresAt:
        description: RFC3339
        example: "2024-01-15T10:15:00Z"
        type: string
      linkCode:
        example: A3F7XQ
        type: string
    type: object
  auth_google.LoginByGoogleRequest:
    properties:
      idToken:
        example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJleGFtcGxlIn0.ZXhhbXBsZQ
        type: string
    required:
    - idToken
    type: object
  auth_google.LoginByGoogleResponse:
    properties:
      accessToken:
        example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJleGFtcGxlIn0.ZXhhbXBsZQ
        type: string
      user:
        $ref: '#/definitions/auth_google.UserResponse'
    type: object
  auth_google.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: mypassword123
        type: string
    required:
    - email
    - password
    type: object
  auth_google.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: mypassword123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth_google.UserResponse:
    properties:
      email:
        example: user@example.com
        type: string
      id:
        example: 5
        type: integer
    type: object
  domain.Product:
    properties:
      brand:
        type: string
      category:
        type: string
      createdAt:
        type: string
      description:
        type: string
      externalId:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      shopId:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
      url:
        type: string
    type: object
  subscription.GrantInput:
    properties:
      comment:
        example: manual grant
        type: string
      period_months:
        description: 1|3|6|12
        example: 1
        type: integer
      price_minor:
        description: monthly price in kopecks
        example: 299000
        type: integer
      shopID:
        type: integer
      tier:
        description: start|business|pro
        example: business
        type: string
    type: object
  subscription.GrantResult:
    properties:
      ai_quota:
        example: 200
        type: integer
      expires_at:
        example: "2026-06-11T00:00:00Z"
        type: string
      max_shops:
        example: 2
        type: integer
      subscription_id:
        example: 7
        type: integer
      tier:
        example: business
        type: string
      user_id:
        example: 3
        type: integer
    type: object
  subscription.StatusResult:
    properties:
      ai_quota:
        example: 200
        type: integer
      ai_used:
        example: 12
        type: integer
      allowed_telegram_chats:
        example: 3
        type: integer
      expires_at:
        example: "2026-06-11T00:00:00Z"
        type: string
      has_active_subscription:
        example: true
        type: boolean
      max_shops:
        example: 2
        type: integer
      status:
        example: active
        type: string
      tier:
        example: business
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'API для сервиса SaleHelp: мониторинг магазинов Wildberries, алерты,
    уведомления, AI-ответы на отзывы.'
  title: SaleHelp API
  version: "1.0"
paths:
  /health:
    get:
      description: |-
        Версия приложения, Go, коммит, время сборки
        Возвращает 200 OK если сервис жив
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - system
      - system
  /v1/auth/confirm-telegram-link:
    post:
      consumes:
      - application/json
      description: Ввести код, полученный в боте после /link_email. Требует JWT (владелец
        email).
      parameters:
      - description: Код из бота
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_google.ConfirmTelegramLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Подтвердить привязку Telegram (код из бота)
      tags:
      - auth
  /v1/auth/google:
    post:
      consumes:
      - application/json
      description: Принимает id_token от Google Sign-In, проверяет его, находит или
        создаёт пользователя, возвращает JWT
      parameters:
      - description: Google id_token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_google.LoginByGoogleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_google.LoginByGoogleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
      summary: Вход через Google
      tags:
      - auth
  /v1/auth/link-telegram:
    post:
      description: Генерирует код, который нужно ввести в боте командой /link &lt;код&gt;
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_google.LinkTelegramResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Код для привязки Telegram
      tags:
      - auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет email и пароль, возвращает JWT и данные пользователя
      parameters:
      - description: Email и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_google.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_google.LoginByGoogleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
      summary: Вход по email
      tags:
      - auth
  /v1/auth/logout:
    post:
      description: Добавляет токен в blocklist до его естественного истечения. После
        перезапуска сервиса токены из blocklist сбрасываются.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Выход из системы
      tags:
      - auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт пользователя по email и паролю (не менее 8 символов), возвращает
        JWT
      parameters:
      - description: Email и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_google.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth_google.LoginByGoogleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "409":
          description: email already registered
          schema:
            $ref: '#/definitions/api.HTTPError'
      summary: Регистрация
      tags:
      - auth
  /v1/me:
    get:
      description: Данные пользователя из JWT (id, email)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_google.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - auth
  /v1/products:
    get:
      description: Товары по идентификатору (query). Используйте GET /v1/shops/{shopId}/products
        для списка по магазину с JWT.
      parameters:
      - description: Идентификатор магазина/мерчанта
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Product'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      summary: Список товаров
      tags:
      - products
  /v1/shop/{id}:
    patch:
      consumes:
      - application/json
      description: 'Обновление настроек магазина: часовой пояс отчётов WB. Требует
        JWT.'
      parameters:
      - description: ID магазина
        in: path
        name: shopId
        required: true
        type: integer
      - description: Поля для обновления
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.UpdateShopRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ShopResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Обновить магазин
      tags:
      - shops
  /v1/shop/{id}/subscription/grant:
    post:
      consumes:
      - application/json
      description: Создаёт подписку для пользователя, владеющего магазином. Вызывать
        может только админ.
      parameters:
      - description: ID магазина
        in: path
        name: id
        required: true
        type: integer
      - description: Тариф, период, сумма
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/subscription.GrantInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscription.GrantResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Выдать/продлить подписку
      tags:
      - subscription
  /v1/shop/{id}/subscription/status:
    get:
      description: Активная подписка (если есть), срок, лимиты и использование Telegram-чатов
      parameters:
      - description: ID магазина
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscription.StatusResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Статус подписки
      tags:
      - subscription
  /v1/shop/{id}/sync:
    post:
      description: Запуск синка по ID магазина (товары, заказы, остатки и т.д.)
      parameters:
      - description: ID магазина
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Синхронизация магазина
      tags:
      - shops
  /v1/shops:
    get:
      description: 'Магазины пользователя (JWT). Query: limit, offset.'
      parameters:
      - default: 20
        description: Лимит
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.ShopResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Список магазинов
      tags:
      - shops
    post:
      consumes:
      - application/json
      description: 'Подключение магазина WB: валидация JWT-токена, создание shop.
        Требует JWT.'
      parameters:
      - description: Название, токен WB, маркетплейс
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.CreateShopRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.ShopResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Создать магазин
      tags:
      - shops
  /v1/shops/{shopId}/ai-settings:
    get:
      description: Возвращает настройки AI-ответов на отзывы для магазина (бренд,
        тон, доп. правила)
      parameters:
      - description: ID магазина
        in: path
        name: shopId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AISettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPError'
      security:
      - BearerAuth: []
      summary: Получить настройки AI
      tags:
      - shop-ai-settings
    put:
      consumes:
      - application/json
      description: 'Задаёт настройки для формирования промпта ИИ: бренд, тон ответа,
        доп. правила, вкл/выкл генерации'
